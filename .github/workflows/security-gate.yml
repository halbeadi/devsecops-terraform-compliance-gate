name: DevSecOps Compliance Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-security-scan:
    name: IaC Security Scan (Trivy & Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Run Trivy for IaC Misconfigurations (Replaces deprecated tfsec)
      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      # 2. Run Checkov for compliance and policy checks
      - name: Run Checkov Cloud Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
